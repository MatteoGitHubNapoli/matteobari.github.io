<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matteo Bari's Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
            color: #2D3748;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        .active-menu-item {
            background-color: #A7D4DB;
            border-left: 4px solid #4A5568;
            color: #2D3748;
            font-weight: 600;
        }
        .active-top-menu-item {
            background-color: #A7D4DB;
            color: #2D3748;
            font-weight: 600;
        }
    </style>
</head>
<body class="flex flex-col sm:flex-row min-h-screen">

    <!-- Top Menu for Mobile/Tablet Screens -->
    <div class="fixed top-0 left-0 w-full bg-[#C3E0E5] shadow-md z-20 flex flex-col items-center p-4 sm:hidden rounded-b-lg">
        <!-- Photo and Title -->
        <div class="flex items-center mb-4">
            <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-white shadow-xl mr-4">
                <img src="images/CVphoto.jpg" onerror="this.onerror=null; this.src='https://placehold.co/150x150/A7D4DB/FFFFFF?text=Photo'" alt="Matteo Bari's CV Photo" class="w-full h-full object-cover">
            </div>
            <h1 class="text-xl font-bold text-gray-800">Matteo Bari</h1>
        </div>
        <!-- Menu pages -->
        <nav class="flex flex-row flex-wrap justify-center w-full">
            <a href="#about-myself" class="menu-item-top py-2 px-3 rounded-md transition-all duration-200 hover:bg-[#A7D4DB] mb-1 mx-1 text-sm text-gray-800">About myself</a>
            <a href="#projects" class="menu-item-top py-2 px-3 rounded-md transition-all duration-200 hover:bg-[#A7D4DB] mb-1 mx-1 text-sm text-gray-800">My Projects</a>
            <a href="#experience" class="menu-item-top py-2 px-3 rounded-md transition-all duration-200 hover:bg-[#A7D4DB] mb-1 mx-1 text-gray-800">My Experience</a>
            <a href="#contacts" class="menu-item-top py-2 px-3 rounded-md transition-all duration-200 hover:bg-[#A7D4DB] mb-1 mx-1 text-sm text-gray-800">Contacts</a>
        </nav>
    </div>

    <!-- Left Menu for Desktop Screens -->
    <div class="hidden sm:flex fixed top-0 left-0 w-64 h-screen flex-shrink-0 flex-col items-center bg-[#C3E0E5] p-6 rounded-r-lg z-10 overflow-y-auto scrollbar-hide">
        
        <!-- CV Photo -->
        <div class="w-32 h-32 md:w-40 md:h-40 bg-gray-700 rounded-full overflow-hidden mb-6 border-4 border-white shadow-xl">
            <img src="images/CVphoto.jpg" onerror="this.onerror=null; this.src='https://placehold.co/150x150/A7D4DB/FFFFFF?text=Photo'" alt="Matteo Bari's CV Photo" class="w-full h-full object-cover">
        </div>

        <!-- Title -->
        <h1 class="text-3xl sm:text-2xl font-bold mb-8 text-center text-gray-800">Matteo Bari</h1>

        <!-- Menu pages -->
        <nav class="flex flex-col w-full text-center">
            <a href="#about-myself" class="menu-item-left py-3 px-4 rounded-md transition-all duration-200 hover:bg-[#A7D4DB] mb-2 border border-transparent text-gray-800">About myself</a>
            <a href="#projects" class="menu-item-left py-3 px-4 rounded-md transition-all duration-200 hover:bg-[#A7D4DB] mb-2 border border-transparent text-gray-800">My Projects</a>
            <a href="#experience" class="menu-item-left py-3 px-4 rounded-md transition-all duration-200 hover:bg-[#A7D4DB] mb-2 border border-transparent text-gray-800">My Experience</a>
            <a href="#contacts" class="menu-item-left py-3 px-4 rounded-md transition-all duration-200 hover:bg-[#A7D4DB] mb-2 border border-transparent text-gray-800">Contacts</a>
        </nav>
    </div>

    <!-- Main content container to accommodate the fixed menu -->
    <div class="flex-1 overflow-hidden pt-48 sm:pt-0 sm:ml-64">
        <div id="content-area" class="w-full p-6 md:p-10 lg:p-16 overflow-y-auto scrollbar-hide">
            <!-- Upper dynamic text slide with a transparent background -->
            <div id="text-slide" class="relative w-full mb-8 rounded-lg overflow-hidden flex items-center justify-center bg-transparent">
                <h2 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl 2xl:text-9xl font-extrabold text-gray-800 tracking-wider text-center whitespace-normal leading-tight">WELCOME</h2>
            </div>

            <!-- Dynamic Title & Content -->
            <div id="page-content">
                <!-- Content will be injected here by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contentArea = document.getElementById('content-area');
            const menuItemsLeft = document.querySelectorAll('.menu-item-left');
            const menuItemsTop = document.querySelectorAll('.menu-item-top');
            const allMenuItems = document.querySelectorAll('.menu-item-left, .menu-item-top');
            const pageContent = document.getElementById('page-content');
            const textSlide = document.getElementById('text-slide');

            // --- DATA MODELS ---
            const data = {
                aboutMyself: {
                    bigText: "WELCOME",
                    mainText: "Welcome to my website! <br> Let me introduce myself. I'm Matteo, and I'm originally from the magnificent city of Naples, where art, culture, and technique inspire my passion for sports and hobbies, all pursued with great initiative. On this site, you'll find the activities I'm involved in, my experience, and my projects.",
                    subparagraphs: [
                        {
                            title: "My journey through school, theater, and beyond",
                            description: "My formal training spans both scientific and humanities disciplines, with interests ranging from computer science to linguistics. Beyond academia, I immersed myself in theater arts within Naples' vibrant scene, learning outside institutional frameworks. I live in the historic center of Naples, where I practice martial arts at one of Italy's oldest gyms, Virtus Partenopea, established in 1926 within the San Domenico Maggiore complex.",
                            image: "images/IMG-20230701-WA0008.jpg"
                        },
                        {
                            title: "AEGEE",
                            description: "Since July 2019, I have embraced the world of AEGEE, becoming an active member at both the local and international levels. <br><br> AEGEE (Association des États Généraux des Étudiants de l'Europe) is a pan-European, non-political, and non-profit student organization, founded in 1985 and entirely run by volunteers. Its mission is to promote integration, cooperation, and dialogue among young people across Europe. Its unique structure is based on Local Antennas (approximately 130 across 40 countries) which, without intermediate national branches, organize cultural events, debates, and integration activities for students in their respective regions, reporting directly to the European Board. Its most iconic project is the Summer University (SU): a 1-3 week international experience entirely organized by a local antenna. This cultural exchange project combines workshops, excursions, themed evenings, and a packed social calendar, offering participants from all over Europe a unique way to travel, build international friendships, and fully immerse themselves in European cultural diversity at an affordable cost. <br><br> The association’s decision-making core is the Agora, a bi-annual general assembly that brings together hundreds of members to vote on strategies, elect the board, and network, serving as a vivid example of participatory democracy and cultural exchange.",
                            images: ["images/IMG_20240817_212947.jpg", "images/IMG_20240810_181711.jpg"]
                        }
                    ]
                },
                projects: {
                    bigText: "PROJECTS & INNOVATION",
                    description: "Here you can explore a selection of my recent work. Each project represents a unique challenge and a creative solution. My projects vary in different types of activities and practical and functional purposes, embracing vast fields of knowledge, from art to technology, carried out with great passion of creative skill and illuminating ingenuity.",
                    panels: [
                        {
                            title: "Prompt engineering",
                            image: "images/promptden.png",
                            description: "In this project, I've applied prompt engineering techniques to develop AI models for various tasks. I focused on optimizing prompts to achieve more accurate and contextually relevant responses from large language models. The project includes examples of creative writing, data analysis, and problem-solving using structured prompts, and so on.<br><br>Below there are the links for the websites where I publish and sell my prompts:",
                            links: [{ title: "promptden", address: "https://promptden.com/" }]
                        }
                    ]
                },
                experience: {
                    bigText: "MY JOURNEYS UNTIL NOW",
                    description: "Here you can see a summary of my professional and personal experiences. Each one has contributed to my skills and growth.",
                    panels: [
                        { place: "FISU", city: "Naples", country: "Italy", role: "Delegate attaché", beginDate: "03/07/2019", endDate: "14/07/2019", image: "images/IMG-20190701-WA0025.jpg", description: "In the beautiful middle of the 30TH SUMMER UNIVERSIADE NAPOLI 2019, as a delegate attaché of the Thailand nation, I provided logistical support and assistance to international delegations during the sporting event, ensuring a smooth and positive experience." },
                        { place: "AEGEE-Napoli", city: "Naples", country: "Italy", role: "General secretary", beginDate: "01/10/2021", endDate: "30/01/2023", image: "images/IMG-20220706-WA0050.jpg", description: "After various and international experiences in AEGEE, I decided the journey to candidate myself as General secretary of the local board. In this role, I managed internal communications and administrative tasks for the AEGEE-Napoli board, facilitating the organization and execution of cultural and integration events." },
                        { place: "Chiaja Hotel de Charme", city: "Naples", country: "Italy", role: "Hospitality establishment receptionist", beginDate: "01/03/2023", endDate: "31/05/2023", image: "images/Via_Chiaia.jpg", link: "https://commons.wikimedia.org/wiki/File:Via_Chiaia.jpg", description: "In the wonderful charm of via Chiaja, once the street of the Neapolitan brothel during the Belle Époque period, I handled guest check-ins and check-outs, provided customer service, and managed reservations at the front desk of this hotel, ensuring a welcoming and efficient guest experience." },
                        { place: "Fondazione AMESCI", city: "Naples", "country": "Italy", "role": "Universal Civil Service volunteer operator", beginDate: "27/06/2023", endDate: "26/06/2024", image: "images/IMG-20231207-WA0039.jpg", description: "As a volunteer operator for the greatest promoting foundation of the Universal Civil Service in Italy, I participated in the intermiedary communication of the community projects, offering support and assistance in various capacities to help the stakeholders and other Universal Civil Service volunteer operators in their social well-being and bureaucratic processes.." },
                        { place: "International Paralympic Committee", city: "Châteauroux", country: "France", role: "Victory ceremony preparation team member", beginDate: "30/08/2024", endDate: "05/09/2024", image: "images/ParalympicGamesParis2025TeamPhoto.jpg", description: "In the extraordinary event of the Paralympic Games Paris 2024, I contributed to the organization and seamless execution of victory ceremonies of shooting sports in Châteauroux during the international competitions, ensuring all protocols and preparations were meticulously followed." },
                        { place: "Città della Scienza", city: "Naples", country: "Italy", role: "FUTURO REMOTO volunteer", beginDate: "19/10/2024", endDate: "20/10/2024", image: "images/e3d20863-aa9a-49ea-bf7a-76de6c9c5e76~1.jpg", description: "As a volunteer at the FUTURO REMOTO science festival, I assisted in event operations and supported educational activities to promote scientific curiosity and engagement." },
                        { place: "Logogramma s.r.l.", city: "Naples", country: "Italy", role: "Computational linguist internship", beginDate: "18/03/2025", endDate: "24/06/2025", image: "images/Gemini_Generated_Image_fr3ch2fr3ch2fr3c.png", description: "During this internship in the Incubator of Campania New Steel placed in Città della Scienza, I have been involved in applying computational and linguistic methods to analyze and process human language data, contributing to research and development in Large Language Models technology." },
                        { place: "FISU", city: "Duisburg and Essen", country: "Germany", role: "FISU World University Games 2025 volunteer", beginDate: "15/07/2025", endDate: "27/07/2025", image: "images/Eröffnungsfeier_Duisburg_FISU-2025-1.jpg", link: "https://commons.wikimedia.org/wiki/File:Er%C3%B6ffnungsfeier_Duisburg_FISU-2025-1.jpg", description: "During the magic of the 32TH SUMMER UNIVERSIADE Rhine-Ruhr 2025, I was part of the volunteering team, assisting with various organizational and operational tasks to ensure the event runs smoothly for all the participants." }
                    ]
                },
                contacts: {
                    bigText: "NEW JOURNEYS",
                    text: "Thank you for visiting my website. I am always open to new opportunities and collaborations. You can reach me through the following channels:",
                    email: "matteobarinapoli@gmail.com",
                    linkedin: "www.linkedin.com/in/matteo-bari-876ba923b"
                }
            };

            // --- NAVIGATION AND CONTENT LOGIC ---
            function updateContent(page) {
                let contentHTML = '';
                let title = '';
                let textSlideContent = '';

                switch (page) {
                    case 'about-myself':
                        title = 'About myself';
                        textSlideContent = data.aboutMyself.bigText;
                        contentHTML = `
                            <p class="text-gray-800 leading-relaxed text-lg mb-4">
                                ${data.aboutMyself.mainText.replace(/<\/n>/g, '<br>')}
                            </p>
                            
                            <!-- Subparagraph 1: Image & Text side-by-side on larger screens -->
                            <div class="mt-8 flex flex-col md:flex-row-reverse items-start gap-8">
                                <div class="w-full md:w-2/5 flex-shrink-0">
                                    <h3 class="text-2xl font-bold text-gray-900 mb-2 md:hidden">${data.aboutMyself.subparagraphs[0].title}</h3>
                                    <img src="${data.aboutMyself.subparagraphs[0].image}" onerror="this.onerror=null; this.src='https://placehold.co/400x300/A7D4DB/FFFFFF?text=Image'" alt="${data.aboutMyself.subparagraphs[0].title}" class="w-full rounded-lg my-4 shadow-md md:m-0">
                                </div>
                                <div class="w-full md:w-3/5">
                                    <h3 class="text-2xl font-bold text-gray-900 mb-2 hidden md:block">${data.aboutMyself.subparagraphs[0].title}</h3>
                                    <p class="text-gray-800 leading-relaxed">${data.aboutMyself.subparagraphs[0].description}</p>
                                </div>
                            </div>

                            <!-- Subparagraph 2: Image & Text side-by-side on larger screens -->
                            <div class="mt-8 flex flex-col md:flex-row items-start gap-8">
                                <div class="w-full md:w-2/5 flex-shrink-0">
                                    <h3 class="text-2xl font-bold text-gray-900 mb-2 md:hidden">${data.aboutMyself.subparagraphs[1].title}</h3>
                                    <div class="flex flex-row space-x-4 mb-4">
                                        <img src="${data.aboutMyself.subparagraphs[1].images[0]}" onerror="this.onerror=null; this.src='https://placehold.co/200x150/A7D4DB/FFFFFF?text=Image'" alt="AEGEE image 1" class="w-1/2 rounded-lg shadow-md">
                                        <img src="${data.aboutMyself.subparagraphs[1].images[1]}" onerror="this.onerror=null; this.src='https://placehold.co/200x150/A7D4DB/FFFFFF?text=Image'" alt="AEGEE image 2" class="w-1/2 rounded-lg shadow-md">
                                    </div>
                                </div>
                                <div class="w-full md:w-3/5">
                                    <h3 class="text-2xl font-bold text-gray-900 mb-2 hidden md:block">${data.aboutMyself.subparagraphs[1].title}</h3>
                                    <p class="text-gray-800 leading-relaxed">${data.aboutMyself.subparagraphs[1].description.replace(/<\/n>/g, '<br>')}</p>
                                </div>
                            </div>
                        `;
                        break;
                    case 'projects':
                        title = 'My Projects';
                        textSlideContent = data.projects.bigText;
                        contentHTML = `
                            <p class="text-gray-800 leading-relaxed text-lg mb-8">
                                ${data.projects.description}
                            </p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <!-- Project Panels -->
                                ${data.projects.panels.map(project => `
                                    <div class="bg-gray-100 p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300">
                                        <h3 class="text-2xl font-bold mb-4 text-gray-900">${project.title}</h3>
                                        <img src="${project.image}" onerror="this.onerror=null; this.src='https://placehold.co/400x300/A7D4DB/FFFFFF?text=Image'" alt="${project.title}" class="w-full rounded-lg mb-4">
                                        <p class="text-gray-700 leading-relaxed mb-4">
                                            ${project.description.replace(/<\/n>/g, '<br>')}
                                        </p>
                                        ${project.links && project.links.length > 0 ? 
                                            `<div class="mt-4 flex flex-col sm:flex-row gap-4">
                                                ${project.links.map(link => `
                                                    <a href="${link.address}" target="_blank" class="w-full sm:w-auto px-6 py-2 rounded-md text-white bg-blue-500 hover:bg-blue-600 transition-colors duration-200 text-center">
                                                        ${link.title}
                                                    </a>
                                                `).join('')}
                                            </div>` 
                                        : ''}
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        break;
                    case 'experience':
                        title = 'My Experience';
                        textSlideContent = data.experience.bigText;
                        contentHTML = `
                            <p class="text-gray-800 leading-relaxed text-lg mb-8">
                                ${data.experience.description}
                            </p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <!-- Experience Panels -->
                                ${data.experience.panels.map(exp => `
                                    <div class="bg-gray-100 p-6 rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300">
                                        <h3 class="text-2xl font-bold mb-2 text-gray-900">${exp.place}, ${exp.city}, ${exp.country}</h3>
                                        <p class="text-gray-600 mb-2"><span class="font-semibold">Role:</span> ${exp.role}</p>
                                        <p class="text-gray-600 text-sm mb-4"><span class="font-semibold">Dates:</span> ${exp.beginDate} - ${exp.endDate}</p>
                                        ${exp.link ? `<a href="${exp.link}" target="_blank" rel="noopener noreferrer">` : ''}
                                            <img src="${exp.image}" onerror="this.onerror=null; this.src='https://placehold.co/400x300/A7D4DB/FFFFFF?text=Image'" alt="${exp.place}" class="w-full rounded-lg mb-4">
                                        ${exp.link ? `</a>` : ''}
                                        <p class="text-gray-700 leading-relaxed">
                                            ${exp.description}
                                        </p>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                        break;
                    case 'contacts':
                        title = 'Contacts';
                        textSlideContent = data.contacts.bigText;
                        contentHTML = `
                            <p class="text-gray-800 leading-relaxed text-lg mb-8">
                                ${data.contacts.text}
                            </p>
                            <div class="space-y-4">
                                <p class="text-lg">
                                    <span class="font-bold">Email:</span> ${data.contacts.email}
                                </p>
                                <p class="text-lg">
                                    <span class="font-bold">LinkedIn:</span> <a href="https://${data.contacts.linkedin}" target="_blank" class="text-blue-600 hover:underline">${data.contacts.linkedin}</a>
                                </p>
                            </div>
                        `;
                        break;
                    default:
                        updateContent('about-myself');
                        return;
                }
                
                // Update the main content area
                pageContent.innerHTML = `<h2 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-gray-900 mb-6">${title}</h2>${contentHTML}`;
                textSlide.innerHTML = `<h2 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl 2xl:text-9xl font-extrabold text-gray-800 tracking-wider text-center whitespace-normal leading-tight">${textSlideContent}</h2>`;
                contentArea.scrollTop = 0; // Scroll to the top of the content area
            }

            // Set up click handlers for all menu items
            allMenuItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    allMenuItems.forEach(el => {
                        el.classList.remove('active-menu-item');
                        el.classList.remove('active-top-menu-item');
                    });
                    
                    const page = e.target.getAttribute('href').substring(1);
                    updateContent(page);
                    
                    // Add active class based on menu type
                    menuItemsLeft.forEach(el => {
                        if (el.getAttribute('href').substring(1) === page) {
                            el.classList.add('active-menu-item');
                        }
                    });
                    menuItemsTop.forEach(el => {
                        if (el.getAttribute('href').substring(1) === page) {
                            el.classList.add('active-top-menu-item');
                        }
                    });
                });
            });

            // Handle initial page load
            const initialPage = window.location.hash.substring(1) || 'about-myself';
            const initialMenuItemLeft = document.querySelector(`.menu-item-left[href="#${initialPage}"]`);
            const initialMenuItemTop = document.querySelector(`.menu-item-top[href="#${initialPage}"]`);
            if (initialMenuItemLeft) {
                initialMenuItemLeft.classList.add('active-menu-item');
            }
            if (initialMenuItemTop) {
                initialMenuItemTop.classList.add('active-top-menu-item');
            }
            updateContent(initialPage);
        });
    </script>
</body>
</html>
